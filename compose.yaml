services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8002"
    # Shared R2 credentials come from env files, never blank interpolation defaults.
    env_file:
      - path: .env
        required: false
      - path: .env.r2
        required: false
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      VERIFICATION_CODE_TTL_SECONDS: ${VERIFICATION_CODE_TTL_SECONDS:-600}
      VERIFICATION_CODE_COOLDOWN_SECONDS: ${VERIFICATION_CODE_COOLDOWN_SECONDS:-60}
      AUTH_LOGIN_MAX_FAILURES: ${AUTH_LOGIN_MAX_FAILURES:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      AUTH_VERIFICATION_MAX_REQUESTS_PER_IP: ${AUTH_VERIFICATION_MAX_REQUESTS_PER_IP:-10}
      AUTH_VERIFICATION_GLOBAL_MAX_REQUESTS: ${AUTH_VERIFICATION_GLOBAL_MAX_REQUESTS:-100}
      AUTH_VERIFICATION_WINDOW_SECONDS: ${AUTH_VERIFICATION_WINDOW_SECONDS:-600}
      GENERATION_MAX_CONCURRENCY: ${GENERATION_MAX_CONCURRENCY:-4}
      GENERATION_MAX_ACTIVE_TASKS: ${GENERATION_MAX_ACTIVE_TASKS:-32}
      GENERATION_MAX_TASKS_PER_USER: ${GENERATION_MAX_TASKS_PER_USER:-4}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      VIDEO_API_BASE_URL: ${VIDEO_API_BASE_URL:-https://direct.beibeihai.xyz}
      VIDEO_PUBLIC_BASE_URL: ${VIDEO_PUBLIC_BASE_URL:-}
      VIDEO_ASSET_SIGNING_SECRET: ${VIDEO_ASSET_SIGNING_SECRET:-}
      VIDEO_POLL_INTERVAL: ${VIDEO_POLL_INTERVAL:-3}
      VIDEO_MAX_WAIT: ${VIDEO_MAX_WAIT:-1200}
      VIDEO_MAX_CONCURRENCY: ${VIDEO_MAX_CONCURRENCY:-2}
      VIDEO_MAX_TASKS_PER_USER: ${VIDEO_MAX_TASKS_PER_USER:-2}
      VIDEO_MAX_ACTIVE_TASKS: ${VIDEO_MAX_ACTIVE_TASKS:-32}
      VIDEO_RESULT_MAX_BYTES: ${VIDEO_RESULT_MAX_BYTES:-536870912}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_KEY_PREFIX: ${R2_KEY_PREFIX:-pictora/videos/}
    volumes:
      - genimage_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8083:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  genimage_data:
    name: genimage_data
