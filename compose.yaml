services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8002"
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      VERIFICATION_CODE_TTL_SECONDS: ${VERIFICATION_CODE_TTL_SECONDS:-600}
      VERIFICATION_CODE_COOLDOWN_SECONDS: ${VERIFICATION_CODE_COOLDOWN_SECONDS:-60}
    volumes:
      - genimage_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8083:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  genimage_data:
    name: genimage_data
