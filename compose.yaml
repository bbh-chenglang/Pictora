services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8002"
    volumes:
      - genimage_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8083:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  genimage_data:
    name: genimage_data
